packages:
  - "packages/*"
  - "agent-packs/*"
  - "examples/*"
  - "apps/*"

# pnpm v11 reads project settings here, not from the package.json pnpm field.
minimumReleaseAgeExclude:
  # Expo SDK patch releases track Xcode/iOS fixes; wait-time would block simulator builds.
  - "expo"
  - "expo-*"
  - "@expo/*"
  - react-native
  - "babel-preset-expo"
  - "@react-native/*"
  - "react-native-*"
  - "@esbuild/*"
  - brace-expansion
  - esbuild
  - fast-uri
  - ip-address
  - js-yaml
  - minimatch
  - nanoid
  - smol-toml@1.7.1
  - body-parser@2.4.0
  - undici
verifyDepsBeforeRun: warn
onlyBuiltDependencies:
  - "@sentry/cli"
overrides:
  "@modelcontextprotocol/client": 2.3.1
  "@modelcontextprotocol/sdk": 1.32.1
  "@modelcontextprotocol/server": 2.3.1
  body-parser: 2.4.0
  source-map-js: 1.2.2
  "@assistant-ui/tap": 0.9.7
  browserslist: 4.28.7
  brace-expansion: 5.0.11
  esbuild: 0.28.1
  fast-uri: 3.1.7
  fast-xml-parser: 5.10.1
  hono: 4.12.25
  postcss: 8.5.18
  sharp: 0.35.5
  shell-quote: 1.11.0
  smol-toml: 1.7.1
  tar: 7.5.21
  ip-address: 10.3.1
  "js-yaml@>=3.0.0 <4.0.0": 3.15.1
  "js-yaml@>=4.0.0 <5.0.0": 4.3.2
  "nanoid@>=3.0.0 <4.0.0": 3.3.18
  "nanoid@>=4.0.0 <6.0.0": 5.1.16
  undici: 7.30.1
  "vite@>=8.0.0 <9.0.0": 8.3.4
  "zod@>=4.0.0 <5.0.0": 4.6.7
  ws: 8.21.0
