packages:
  - "packages/*"
  - "agent-packs/*"
  - "examples/*"

# pnpm v11 reads project settings here, not from the package.json pnpm field.
minimumReleaseAgeExclude:
  - "@esbuild/*"
  - brace-expansion
  - esbuild
  - fast-uri
  - ip-address
  - js-yaml
  - minimatch
  - nanoid
  - smol-toml@1.7.1
  - undici
verifyDepsBeforeRun: warn
onlyBuiltDependencies:
  - "@sentry/cli"
overrides:
  "@assistant-ui/tap": 0.9.7
  browserslist: 4.28.7
  brace-expansion: 5.0.9
  esbuild: 0.28.1
  fast-uri: 3.1.6
  fast-xml-parser: 5.10.1
  hono: 4.12.25
  postcss: 8.5.18
  sharp: 0.35.4
  shell-quote: 1.9.0
  smol-toml: 1.7.1
  tar: 7.5.21
  ip-address: 10.3.1
  "js-yaml@>=3.0.0 <4.0.0": 3.15.1
  "js-yaml@>=4.0.0 <5.0.0": 4.3.1
  "nanoid@>=3.0.0 <4.0.0": 3.3.18
  "nanoid@>=4.0.0 <6.0.0": 5.1.16
  undici: 7.29.0
  ws: 8.21.0
patchedDependencies:
  extract-zip@2.0.1: patches/extract-zip@2.0.1.patch
