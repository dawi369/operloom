app = "assistant-mk1-local-runner"
primary_region = "fra"

[build]
dockerfile = "Dockerfile.langgraph"

[env]
LANGGRAPH_PORT = "2024"
LANGGRAPH_UPSTREAM_URL = "http://127.0.0.1:2024"
OPENROUTER_APP_NAME = "assistant-mk1-local-runner"
OPENROUTER_SITE_URL = "http://127.0.0.1:3101"
WORKBENCH_CALLBACK_ORIGIN = "http://127.0.0.1:8787"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0
processes = ["app"]

[[http_service.checks]]
interval = "15s"
timeout = "2s"
grace_period = "20s"
method = "GET"
path = "/health/live"

[vm]
cpu_kind = "shared"
cpus = 1
memory = "1gb"
