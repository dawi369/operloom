name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

# Development posture: one fast job per push. Browser conformance, Docker and the
# production build run in release-gates.yml on demand or nightly.
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Seconds, and it is the only step that can go red without a code change:
      # a new advisory against a pinned dependency must block the next push,
      # not wait for the nightly release gate.
      - name: Dependency advisories
        run: pnpm verify:security

      - name: Verify (typecheck, lint, unit tests, contracts, migrations)
        run: pnpm verify:fast
        env:
          SENTRY_AUTH_TOKEN: ""

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-failure-evidence
          if-no-files-found: ignore
          path: |
            output/conformance
            output/extension-contract
            output/sdk-consumer
            output/client-consumer
