name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

# Development posture: one fast job per push. Browser conformance, Docker and the
# production build run in release-gates.yml on demand or nightly.
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Seconds, and it is the only step that can go red without a code change:
      # a new advisory against a pinned dependency must block the next push,
      # not wait for the nightly release gate.
      - name: Dependency advisories
        run: pnpm verify:security

      - name: Verify (typecheck, lint, unit tests, contracts, migrations)
        run: pnpm verify:fast
        env:
          SENTRY_AUTH_TOKEN: ""

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-failure-evidence
          if-no-files-found: ignore
          path: |
            output/conformance
            output/extension-contract
            output/sdk-consumer
            output/client-consumer

  # Continuous staging: every green push to main deploys the worker-only
  # staging environment and smokes it. Opt in with the repository variable
  # OPERLOOM_STAGING_DEPLOY=true and the CLOUDFLARE_API_TOKEN and
  # CLOUDFLARE_ACCOUNT_ID secrets on the `staging` environment; forks without
  # them skip the job. Signing and provider secrets are managed by hand with
  # `pnpm environment:worker secrets` and are never touched here.
  staging:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.OPERLOOM_STAGING_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: staging
      url: https://operloom-staging-control-plane.david-erwin-cz68.workers.dev/health
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and render the staging manifest
        run: pnpm environment:worker check && pnpm environment:worker render

      - name: Apply D1 migrations
        run: pnpm environment:worker migrate

      - name: Deploy the Worker
        run: pnpm environment:worker deploy

      - name: Smoke
        run: pnpm environment:worker smoke
