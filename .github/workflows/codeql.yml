name: CodeQL

# GitHub-native static analysis for the TypeScript in the console, Worker,
# runner and packages. Free for public repositories; results land under
# Security → Code scanning, and a new high-severity alert fails the pull
# request check. Dependency advisories are a separate gate (pnpm verify:security
# in verify.yml); this one looks at our own code paths.

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  schedule:
    # Weekly, Monday 04:23 UTC: picks up new query packs against unchanged code.
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze JavaScript / TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # security-extended adds the injection and prototype-pollution
          # queries that matter for a server that executes model tool calls.
          queries: security-extended
          config: |
            paths-ignore:
              - node_modules
              - output
              - generated
              - "**/*.test.ts"
              - "**/*.test.tsx"
              - tests/e2e

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
