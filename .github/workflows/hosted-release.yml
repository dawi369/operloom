name: Hosted release evidence

on:
  workflow_dispatch:
    inputs:
      target:
        description: Protected hosted target
        type: choice
        required: true
        options: [acceptance, production]
      gate:
        description: Separately approved evidence phase
        type: choice
        required: true
        options:
          [
            preflight,
            configuration,
            observability,
            public,
            level3,
            vault,
            mutation,
            data-lifecycle,
            alert-redelivery,
            soak-start,
            soak-finish,
            all-short,
          ]
      soak_state_run_id:
        description: Workflow run containing the same-SHA soak-start artifact (soak-finish only)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: hosted-release-${{ inputs.target }}-${{ inputs.gate }}
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ inputs.target }}
    env:
      WORKBENCH_ENVIRONMENT: ${{ inputs.target }}
      GITHUB_SHA: ${{ github.sha }}
      HOSTED_VERCEL_ORIGIN: ${{ vars.HOSTED_VERCEL_ORIGIN }}
      HOSTED_CLOUDFLARE_ORIGIN: ${{ vars.HOSTED_CLOUDFLARE_ORIGIN }}
      HOSTED_FLY_ORIGIN: ${{ vars.HOSTED_FLY_ORIGIN }}
      HOSTED_FLY_APP: ${{ vars.HOSTED_FLY_APP }}
      HOSTED_VAULT_WORKSPACE_ID: ${{ vars.HOSTED_VAULT_WORKSPACE_ID }}
      HOSTED_MUTATION_ORGANIZATION_ID: ${{ vars.HOSTED_MUTATION_ORGANIZATION_ID }}
      CLOUDFLARE_CONTROL_PLANE_URL: ${{ vars.HOSTED_CLOUDFLARE_ORIGIN }}
      CLOUDFLARE_CONTROL_PLANE_FACADE_SIGNING_SECRET: ${{ secrets.CLOUDFLARE_CONTROL_PLANE_FACADE_SIGNING_SECRET }}
      WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
      HOSTED_MUTATION_CONNECTION_SECRET: ${{ secrets.HOSTED_MUTATION_CONNECTION_SECRET }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      WORKBENCH_RELEASE_OPERATOR: ${{ github.actor }}
      SOAK_STATE_RUN_ID: ${{ inputs.soak_state_run_id }}
    steps:
      - name: Check out immutable source
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Map protected non-secret target identifiers
        shell: bash
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          CLOUDFLARE_ORIGIN: ${{ vars.HOSTED_CLOUDFLARE_ORIGIN }}
          FLY_ORIGIN: ${{ vars.HOSTED_FLY_ORIGIN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORIGIN: ${{ vars.HOSTED_VERCEL_ORIGIN }}
          WORKOS_APPLICATION_ID: ${{ vars.WORKOS_APPLICATION_ID }}
          ACCEPTANCE_WORKSPACE_ID: ${{ vars.HOSTED_VAULT_WORKSPACE_ID }}
        run: |
          prefix="WORKBENCH_${WORKBENCH_ENVIRONMENT^^}"
          {
            echo "${prefix}_D1_DATABASE_ID=${D1_DATABASE_ID}"
            echo "${prefix}_CLOUDFLARE_ORIGIN=${CLOUDFLARE_ORIGIN}"
            echo "${prefix}_FLY_ORIGIN=${FLY_ORIGIN}"
            echo "${prefix}_VERCEL_ORG_ID=${VERCEL_ORG_ID}"
            echo "${prefix}_VERCEL_PROJECT_ID=${VERCEL_PROJECT_ID}"
            echo "${prefix}_VERCEL_ORIGIN=${VERCEL_ORIGIN}"
            echo "${prefix}_WORKOS_APPLICATION_ID=${WORKOS_APPLICATION_ID}"
            if [[ "${WORKBENCH_ENVIRONMENT}" == "acceptance" ]]; then
              echo "WORKBENCH_ACCEPTANCE_WORKSPACE_ID=${ACCEPTANCE_WORKSPACE_ID}"
            else
              echo "WORKBENCH_PRODUCTION_ACCEPTANCE_WORKSPACE_ID=${ACCEPTANCE_WORKSPACE_ID}"
            fi
          } >> "${GITHUB_ENV}"

      - name: Validate selected target
        run: pnpm environment:check --target "${WORKBENCH_ENVIRONMENT}"

      - name: Run approved hosted gate
        shell: bash
        run: |
          if [[ "${WORKBENCH_ENVIRONMENT}" == "production" && \
                ("${{ inputs.gate }}" == "mutation" || "${{ inputs.gate }}" == "data-lifecycle" || \
                 "${{ inputs.gate }}" == "alert-redelivery" || "${{ inputs.gate }}" == soak-*) ]]; then
            echo "Destructive and conformance-only evidence is intentionally unavailable in production." >&2
            exit 2
          fi
          run_gate() {
            local gate="$1"
            local kind="hosted.${gate}"
            case "${gate}" in
              preflight) command=(pnpm acceptance:hosted:level3:preflight) ;;
              configuration) command=(pnpm acceptance:hosted:configuration -- --target "${WORKBENCH_ENVIRONMENT}") ;;
              observability) command=(pnpm acceptance:hosted:observability) ;;
              public) command=(pnpm acceptance:hosted:public) ;;
              level3) export WORKBENCH_HOSTED_DRILL_MODE=true; command=(pnpm acceptance:hosted:level3) ;;
              vault) export WORKBENCH_HOSTED_VAULT_MODE=true; command=(pnpm acceptance:hosted:vault) ;;
              mutation) export WORKBENCH_HOSTED_MUTATION_MODE=true; command=(pnpm acceptance:hosted:mutation) ;;
              data-lifecycle) export WORKBENCH_HOSTED_DATA_LIFECYCLE_MODE=true; command=(pnpm acceptance:hosted:data-lifecycle) ;;
              alert-redelivery)
                export WORKBENCH_HOSTED_ALERT_REDELIVERY_MODE=true
                kind="hosted.alert-outage-redelivery"
                command=(pnpm acceptance:hosted:alert-redelivery)
                ;;
              soak-start)
                export WORKBENCH_HOSTED_SOAK_MODE=true
                command=(pnpm acceptance:hosted:soak -- --phase start)
                ;;
              soak-finish)
                [[ -n "${SOAK_STATE_RUN_ID}" ]] || { echo "soak_state_run_id is required" >&2; exit 2; }
                mkdir -p "output/release/${GITHUB_SHA}"
                gh run download "${SOAK_STATE_RUN_ID}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --name "hosted-acceptance-soak-start-${GITHUB_SHA}" \
                  --dir "output/release/${GITHUB_SHA}"
                export WORKBENCH_HOSTED_SOAK_MODE=true
                pnpm acceptance:hosted:soak -- --phase finish \
                  --state "output/release/${GITHUB_SHA}/soak-24h-state.json"
                pnpm release:evidence:record -- --target acceptance \
                  --kind hosted.soak-24h \
                  --input "output/release/${GITHUB_SHA}/soak-24h.json" \
                  --confirm "acceptance:hosted.soak-24h:${GITHUB_SHA}"
                return
                ;;
              *) exit 2 ;;
            esac
            pnpm release:evidence:run -- --target "${WORKBENCH_ENVIRONMENT}" \
              --kind "${kind}" -- "${command[@]}"
          }
          if [[ "${{ inputs.gate }}" == "all-short" ]]; then
            if [[ "${WORKBENCH_ENVIRONMENT}" == "acceptance" ]]; then
              for gate in preflight public level3 vault mutation data-lifecycle alert-redelivery; do run_gate "${gate}"; done
            else
              for gate in preflight configuration observability public; do run_gate "${gate}"; done
            fi
          else
            run_gate "${{ inputs.gate }}"
          fi

      - name: Upload secret-free release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hosted-${{ inputs.target }}-${{ inputs.gate }}-${{ github.sha }}
          if-no-files-found: ignore
          path: output/release/${{ github.sha }}
